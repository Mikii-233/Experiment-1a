<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>实验2a｜智驾乘车体验（成人版）</title>

  <!-- exp2a/index.html 位于子目录；jsPsych 与 plugins 位于仓库根目录 -->
  <script src="../jspsych/jspsych.js"></script>
  <script src="../plugins/plugin-html-keyboard-response.js"></script>
  <link rel="stylesheet" href="../jspsych/jspsych.css">

  <style>
    :root {
      --bg:#1e1e24;
      --panel:#2b2b36;
      --panel-deep:#15151a;
      --line:#444;
      --text:#e8e8ea;
      --muted:#aeb7c2;
      --blue:#64b5f6;
      --green:#4CAF50;
      --orange:#FF9800;
      --warning:#ffb74d;
    }

    html, body {
      width:100%;
      min-height:100%;
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:"Microsoft YaHei","PingFang SC",sans-serif;
      overflow-x:hidden;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
      user-select:none;
    }

    button, input, select { touch-action:manipulation; font-family:inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    #login-screen, #jspsych-target { width:100%; min-height:100dvh; }
    .hidden { display:none !important; }

    .jspsych-display-element {
      background:var(--bg);
      color:var(--text);
      min-height:100dvh;
      overflow-x:hidden;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }
    .jspsych-content-wrapper {
      width:100%;
      min-height:100dvh;
      height:auto;
      padding:0;
      box-sizing:border-box;
      justify-content:center;
      align-items:center;
    }
    .jspsych-content { width:100%; max-width:none; }

    .fullscreen-container {
      width:100%;
      min-height:100dvh;
      height:auto;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      box-sizing:border-box;
      padding:18px 0;
    }

    .guide-box {
      width:min(920px,90vw);
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:14px;
      padding:36px 48px;
      box-sizing:border-box;
      font-size:20px;
      line-height:1.8;
      text-align:left;
    }
    .guide-title {
      text-align:center;
      color:var(--blue);
      font-size:32px;
      font-weight:800;
      margin-bottom:24px;
    }
    .context-box {
      background:#383846;
      border-left:5px solid var(--warning);
      border-radius:6px;
      padding:16px 22px;
      margin-bottom:20px;
      font-size:18px;
      line-height:1.7;
    }
    .highlight { color:var(--warning); font-weight:800; }
    .ability-text { color:var(--green); font-weight:800; }
    .emotion-text { color:var(--orange); font-weight:800; }

    .continue-btn, .action-btn, .login-btn {
      min-width:180px;
      min-height:52px;
      padding:11px 28px;
      border:0;
      border-radius:10px;
      background:var(--green);
      color:white;
      font-size:19px;
      font-weight:800;
      cursor:pointer;
    }
    .continue-btn:disabled, .action-btn:disabled { opacity:.4; cursor:not-allowed; }

    /* ---------- 测试版登录 ---------- */
    .login-box {
      width:min(560px,90vw);
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:14px;
      padding:38px 34px;
      text-align:center;
      box-sizing:border-box;
    }
    .login-title { color:var(--blue); font-weight:800; font-size:30px; margin-bottom:16px; }
    .login-sub { color:var(--muted); font-size:15px; line-height:1.65; margin-bottom:18px; }
    .login-input, .risk-select {
      width:min(360px,78vw);
      box-sizing:border-box;
      background:var(--panel-deep);
      color:white;
      border:2px solid var(--blue);
      border-radius:9px;
      padding:11px 12px;
      font-size:20px;
      text-align:center;
      outline:none;
      margin-bottom:14px;
    }
    .dev-note {
      width:min(420px,82vw);
      margin:0 auto 18px;
      padding:10px 12px;
      border-radius:8px;
      background:#33291d;
      border:1px solid #76582d;
      color:#ffd69a;
      font-size:13px;
      line-height:1.5;
      text-align:left;
    }

    /* ---------- 点数分配 ---------- */
    .allocation-wrap {
      display:flex;
      gap:28px;
      justify-content:center;
      align-items:stretch;
      margin:22px 0;
    }
    .allocation-card {
      width:310px;
      padding:22px;
      border-radius:12px;
      background:var(--panel-deep);
      border:1px solid var(--line);
      text-align:center;
      box-sizing:border-box;
    }
    .allocation-card.ability { border-top:5px solid var(--green); }
    .allocation-card.emotion { border-top:5px solid var(--orange); }
    .allocation-score { font-size:52px; font-weight:900; margin:12px 0; }
    .allocation-controls { display:flex; justify-content:center; gap:16px; }
    .mini-btn {
      width:58px;
      height:48px;
      border-radius:9px;
      border:1px solid #666;
      background:#383846;
      color:white;
      font-size:28px;
      font-weight:800;
      cursor:pointer;
    }
    .mini-btn:disabled { opacity:.3; cursor:not-allowed; }

    /* ---------- 四助手介绍 ---------- */
    .assistant-intro-grid {
      width:min(1050px,92vw);
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }
    .assistant-intro-card {
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      padding:16px 18px;
      display:grid;
      grid-template-columns:92px 1fr;
      gap:15px;
      align-items:center;
      box-sizing:border-box;
    }
    .avatar-box {
      width:88px;
      height:88px;
      border-radius:14px;
      background:#20212a;
      border:1px solid #4b4b56;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      flex:0 0 auto;
    }
    .avatar-box img { width:88%; height:88%; object-fit:contain; display:block; }
    .avatar-fallback { display:none; align-items:center; justify-content:center; font-size:48px; width:100%; height:100%; }
    .assistant-intro-title { font-size:22px; font-weight:900; margin-bottom:7px; }
    .state-row { display:flex; flex-direction:column; align-items:flex-start; gap:7px; }
    .state-label { font-size:16px; font-weight:800; }
    .energy-bars { display:flex; gap:8px; align-items:center; }
    .energy-cell {
      width:58px;
      height:20px;
      border-radius:6px;
      border:2px solid #717985;
      box-sizing:border-box;
      background:rgba(255,255,255,.04);
    }
    .energy-cell.ability.on { background:var(--green); border-color:var(--green); box-shadow:0 0 9px rgba(76,175,80,.32); }
    .energy-cell.emotion.on { background:var(--orange); border-color:var(--orange); box-shadow:0 0 9px rgba(255,152,0,.32); }
    .assistant-note { color:var(--muted); font-size:14px; line-height:1.5; margin-top:7px; }

    /* ---------- Trial ---------- */
    .trial-shell {
      width:100%;
      height:100dvh;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      box-sizing:border-box;
      background:var(--bg);
    }
    .trial-header {
      flex:0 0 6%;
      min-height:42px;
      width:100%;
      background:var(--panel-deep);
      border-bottom:1px solid #333;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:5px clamp(12px,4vw,50px);
      box-sizing:border-box;
      color:var(--muted);
      font-size:clamp(12px,1vw,16px);
    }
    .scene-zone {
      flex:0 0 36%;
      min-height:210px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--panel-deep);
      padding:6px 0;
      box-sizing:border-box;
    }
    .scene-image-frame {
      position:relative;
      width:min(94vw,720px);
      aspect-ratio:637/315;
      max-height:100%;
      border-radius:9px;
      overflow:hidden;
      background:#101116;
      box-shadow:0 4px 16px rgba(0,0,0,.45);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .scene-image { width:100%; height:100%; object-fit:contain; display:block; }
    .scene-load-hint {
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:14px;
      text-align:center;
      color:var(--muted);
      background:#101116;
      font-size:15px;
      z-index:2;
    }

    .assistant-zone {
      flex:0 0 27%;
      min-height:158px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      border-top:1px solid #35353e;
      border-bottom:1px solid #45454e;
      padding:7px 12px;
      box-sizing:border-box;
    }
    .assistant-info-card {
      width:min(920px,94vw);
      height:auto;
      max-height:205px;
      min-height:145px;
      background:var(--panel);
      border:1px solid #4b4b56;
      border-radius:13px;
      display:flex;
      flex-direction:column;
      padding:11px 18px 13px;
      box-sizing:border-box;
    }
    .assistant-badge {
      font-size:clamp(15px,1.25vw,20px);
      font-weight:900;
      color:white;
      text-align:center;
      margin-bottom:7px;
      flex:0 0 auto;
    }
    .assistant-info-main {
      width:100%;
      min-width:0;
      flex:1 1 auto;
      display:grid;
      grid-template-columns:148px minmax(0,1fr);
      gap:18px;
      align-items:center;
    }
    .assistant-left-stack {
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .formal-state-row {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
      margin:0;
    }
    .formal-state-label { font-size:clamp(14px,1vw,18px); font-weight:900; text-align:center; }
    .assistant-info-card .avatar-box { width:92px; height:92px; }
    .assistant-prompt-wrap { min-width:0; display:flex; align-items:center; height:100%; }
    .prompt-inline-label { font-weight:900; color:#dce6f0; }

    .rating-zone {
      flex:1 1 27%;
      min-height:176px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:var(--panel);
      padding:10px 8px calc(8px + env(safe-area-inset-bottom));
      box-sizing:border-box;
      overflow:hidden;
    }
    .rating-topline {
      width:min(760px,92vw);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-height:28px;
    }
    .rating-progress { color:#9fa8b3; font-size:13px; }
    .rating-back {
      border:1px solid #666;
      border-radius:7px;
      background:#1f2028;
      color:#c8d2dc;
      min-height:34px;
      padding:5px 10px;
      font-size:12px;
      cursor:pointer;
    }
    .rating-back.hidden-visibility { visibility:hidden; pointer-events:none; }
    .rating-question {
      width:min(820px,94vw);
      text-align:center;
      font-size:clamp(18px,1.45vw,27px);
      line-height:1.35;
      font-weight:900;
      margin:5px 0 8px;
      color:#f3f3f3;
      overflow-wrap:anywhere;
    }
    .rating-options {
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:12px;
      width:min(760px,92vw);
    }
    .rating-option {
      min-width:0;
      min-height:52px;
      border-radius:10px;
      border:2px solid #59616d;
      background:#1f2028;
      color:var(--blue);
      font-size:23px;
      font-weight:900;
      cursor:pointer;
    }
    .rating-option.selected {
      border-color:var(--green);
      background:rgba(76,175,80,.16);
      box-shadow:0 0 0 2px rgba(76,175,80,.14) inset;
    }
    .rating-option:disabled { opacity:.3; cursor:not-allowed; }
    .rating-anchors {
      width:min(760px,92vw);
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      margin-top:3px;
      color:#b8c4d1;
      font-size:14px;
    }
    .rating-anchors span:nth-child(1){text-align:left;}
    .rating-anchors span:nth-child(2){text-align:center;}
    .rating-anchors span:nth-child(3){text-align:right;}
    .rating-confirm {
      margin-top:7px;
      min-width:150px;
      min-height:42px;
      border:0;
      border-radius:9px;
      background:var(--green);
      color:white;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }
    .rating-confirm:disabled { opacity:.4; cursor:not-allowed; }


    /* ---------- 功能说明框 ---------- */
    .speech-bubble {
      position:relative;
      background:#20212a;
      border:1px solid #555b67;
      border-radius:11px;
      padding:10px 13px;
      font-size:clamp(14px,1.08vw,19px);
      line-height:1.55;
      color:#f0f0f0;
      overflow-wrap:anywhere;
      box-shadow:0 2px 8px rgba(0,0,0,.16);
    }
    .speech-bubble::before {
      content:'';
      position:absolute;
      left:-9px;
      top:18px;
      width:16px;
      height:16px;
      background:#20212a;
      border-left:1px solid #555b67;
      border-bottom:1px solid #555b67;
      transform:rotate(45deg);
    }

    .function-description {
      width:100%;
      background:#20212a;
      border:1px solid #555b67;
      border-radius:11px;
      padding:10px 15px 11px;
      box-sizing:border-box;
      color:#f0f0f0;
      box-shadow:0 2px 8px rgba(0,0,0,.16);
    }
    /* “功能说明”单独作为标题，不占用三条功能解释的行内空间。 */
    .function-description-title {
      font-weight:900;
      color:#dce6f0;
      font-size:clamp(13px,1vw,17px);
      line-height:1.25;
      margin-bottom:7px;
    }
    /* 感知→预测→执行固定三行呈现，便于与左侧三行能量格一一对应。 */
    .function-description-lines {
      display:grid;
      gap:5px;
    }
    .function-description-line {
      font-size:clamp(13px,1.02vw,18px);
      line-height:1.35;
      white-space:nowrap;
    }

    /* ---------- 结束 ---------- */
    .debug-data {
      width:min(820px,88vw);
      max-height:220px;
      overflow:auto;
      margin:16px auto;
      padding:10px;
      box-sizing:border-box;
      background:#111217;
      border:1px solid #444;
      border-radius:8px;
      color:#9eadba;
      font-size:11px;
      user-select:text;
      white-space:pre-wrap;
      text-align:left;
    }

    /* ---------- 平板 ---------- */
    @media (max-width:900px) {
      .guide-box { width:94vw; padding:24px; font-size:17px; }
      .guide-title { font-size:27px; }
      .assistant-intro-grid { width:94vw; gap:10px; }
      .assistant-intro-card { grid-template-columns:76px 1fr; padding:12px; }
      .avatar-box { width:72px; height:72px; }
      .energy-cell { width:43px; height:18px; }
      .assistant-info-card { width:96vw; padding:10px 14px 12px; }
      .assistant-info-main { grid-template-columns:132px minmax(0,1fr); gap:12px; }
      .assistant-info-card .avatar-box { width:82px; height:82px; }
      .rating-options { gap:8px; }
    }

    /* ---------- 手机竖屏 ---------- */
    @media (max-width:650px) {
      html,body,#login-screen,#jspsych-target,.jspsych-display-element { min-height:100svh; }
      .jspsych-content-wrapper { min-height:100svh; height:auto; align-items:flex-start; }
      .fullscreen-container {
        min-height:100svh;
        height:auto;
        justify-content:flex-start;
        padding:12px 0 calc(16px + env(safe-area-inset-bottom));
      }
      #login-screen.fullscreen-container { justify-content:center; }

      .guide-box { width:92vw; padding:16px 15px; font-size:15px; line-height:1.55; }
      .guide-title { font-size:23px; margin-bottom:12px; }
      .context-box { padding:10px 12px; font-size:14px; line-height:1.5; margin-bottom:10px; }
      .continue-btn,.action-btn,.login-btn { min-height:46px; min-width:150px; padding:8px 16px; font-size:16px; }

      .login-box { width:92vw; padding:22px 16px; }
      .login-title { font-size:24px; }
      .login-input,.risk-select { width:78vw; font-size:18px; }

      .allocation-wrap { width:100%; gap:8px; margin:12px 0; }
      .allocation-card { width:calc(50% - 4px); padding:11px 7px; }
      .allocation-score { font-size:38px; margin:7px 0; }
      .mini-btn { width:48px; height:42px; font-size:23px; }

      .assistant-intro-grid { grid-template-columns:1fr 1fr; width:92vw; gap:7px; }
      .assistant-intro-card { grid-template-columns:52px 1fr; gap:7px; padding:8px 7px; border-radius:9px; }
      .assistant-intro-card .avatar-box { width:50px; height:50px; border-radius:9px; }
      .assistant-intro-title { font-size:14px; margin-bottom:3px; }
      .state-label { font-size:11.5px; }
      .energy-bars { gap:4px; }
      .energy-cell { width:25px; height:11px; border-width:1.5px; border-radius:3px; }
      .assistant-note { font-size:10.5px; margin-top:3px; }

      .trial-shell {
        height:100svh;
        min-height:100svh;
        overflow-x:hidden;
        overflow-y:auto;
        -webkit-overflow-scrolling:touch;
        overscroll-behavior-y:contain;
        padding-bottom:env(safe-area-inset-bottom);
      }
      .trial-header { flex:0 0 5%; min-height:34px; padding:3px 9px; font-size:11px; }
      .scene-zone { flex:0 0 31%; min-height:165px; padding:3px 0; }
      .scene-image-frame { width:96vw; max-width:637px; }
      /* 手机正式试次：助手区域改为内容驱动高度，避免中部出现大块空白。 */
      .assistant-zone { flex:0 0 auto; min-height:0; padding:6px 6px; }
      .assistant-info-card {
        width:95vw;
        height:auto;
        min-height:0;
        max-height:none;
        padding:7px 9px 9px;
        border-radius:10px;
      }
      .assistant-badge { font-size:13px; margin-bottom:4px; }
      /* 状态与能量条位于头像正上方；气泡固定在头像右侧并垂直居中。 */
      .assistant-info-main { grid-template-columns:88px minmax(0,1fr); gap:8px; align-items:center; }
      .assistant-left-stack { gap:4px; justify-content:flex-start; }
      .formal-state-row { gap:3px; margin:0; }
      .formal-state-label { font-size:12px; line-height:1.2; }
      .assistant-info-card .energy-bars { gap:4px; }
      .assistant-info-card .energy-cell { width:28px; height:12px; }
      .assistant-info-card .avatar-box { width:58px; height:58px; border-radius:9px; }
      .assistant-prompt-wrap { height:auto; align-self:center; width:100%; }
      .speech-bubble { width:100%; box-sizing:border-box; padding:8px 10px; font-size:12.5px; line-height:1.45; border-radius:9px; }
      .speech-bubble::before { left:-7px; top:50%; transform:translateY(-50%) rotate(45deg); width:12px; height:12px; }


      .rating-zone { flex:1 0 30%; min-height:176px; padding:6px 5px calc(6px + env(safe-area-inset-bottom)); }
      .rating-topline { width:94vw; min-height:29px; }
      .rating-progress { font-size:11px; }
      .rating-back { min-height:32px; font-size:10.5px; padding:4px 7px; }
      .rating-question { width:94vw; font-size:15px; line-height:1.35; margin:1px 0 5px; }
      .rating-options { width:94vw; gap:6px; }
      .rating-option { min-height:44px; padding:1px; font-size:19px; border-radius:8px; }
      .rating-anchors { width:94vw; font-size:10.5px; }
      .rating-confirm { min-height:40px; margin-top:5px; font-size:14px; }

      .trial-shell.adaptive-scroll {
        height:auto !important;
        min-height:100svh !important;
        overflow-y:auto !important;
      }
      .trial-shell.adaptive-scroll > * {
        flex:0 0 auto !important;
        height:auto !important;
        max-height:none !important;
        overflow:visible !important;
      }
      .trial-shell.adaptive-scroll .scene-zone { min-height:170px; }
      .trial-shell.adaptive-scroll .assistant-zone { min-height:0; padding:8px 6px; }
      .trial-shell.adaptive-scroll .assistant-info-card { height:auto; min-height:0; }
      .trial-shell.adaptive-scroll .rating-zone { min-height:0; padding-top:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
    }

    @media (max-width:900px) and (orientation:landscape) {
      .trial-shell { min-height:100dvh; height:auto; overflow-y:auto; }
    }
  

    /* ---------- 实验2a：概念学习 + 小测验 ---------- */
    .concept-intro {
      width:min(960px,90vw);
      margin:0 auto 18px;
      text-align:center;

    .assistant-info-main.three-dim {

<div id="login-screen" class="fullscreen-container">
  <div class="login-box">
    <div class="login-title">进入智驾乘车体验</div>
    <div id="login-info" class="login-sub">请输入您在前一部分体验中使用的匿名实验编号，以便匹配不同部分的数据。请勿填写姓名、手机号等个人信息。</div>
    <input id="subject-id-input" class="login-input" type="text" placeholder="例如：P-ABC123" maxlength="30" autocomplete="off">
    <br>
    <button id="login-btn" class="login-btn">进入体验</button>
  </div>
</div>

<div id="jspsych-target"></div>

<script>
  /* =========================================================
     实验2a｜能力属性三维度 × 风险水平（成人版）
     ---------------------------------------------------------
     页面骨架：继承实验1b的正式trial响应式布局
     学习流程：继承实验3a的概念学习 + 小测验框架
     正式设计：6种能力配置 × 2风险水平 × 2重复 = 24 trial
     平衡：DataPipe 3 conditions -> Sequence A / B / C
     数据：DataPipe -> Google Drive
     ========================================================= */

  const STUDY_ID = 'Exp2A';
  const DEFAULT_STUDY_PATH = '1A_2A';
  const AGE_GROUP = 'Adult';
  const IMAGE_FORMAT = 'lossless_webp';
  const ASSET_BASE = '../risk_img/';
  const ROBOT_IMAGE = `${ASSET_BASE}robot.webp`;

  const MASTER_PID_KEY = 'master_participant_id_v1';
  const STUDY_PATH_KEY = 'master_study_path_v1';
  const BASELINE_ABILITY_KEY_PREFIX = 'baseline_ability_points_v1_';
  const BASELINE_EMOTION_KEY_PREFIX = 'baseline_emotion_points_v1_';

  const DATAPIPE_EXPERIMENT_ID = 'SknRyZ6fmGLx';
  const DATAPIPE_REQUIRED = true;
  const DATAPIPE_BASE = 'https://pipe.jspsych.org/api';

  let currentSubjectId = '';
  let studyPath = DEFAULT_STUDY_PATH;
  let dataPipeCondition = null;
  let sequenceName = '';
  let currentVersion = '';
  let baselineAbility = null;
  let baselineEmotion = null;
  let conceptQuizAttempts = null;
  let energyQuizAttempts = null;

  let experimentStartedAtMs = null;
  let formalStartedAtMs = null;
  let experimentEndedAtMs = null;
  let pageHiddenCount = 0;
  let pageHiddenTotalMs = 0;
  let pageHiddenStartedAtMs = null;

  let sessionUUID = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : `fallback-${Date.now()}-${Math.random().toString(16).slice(2)}`;

  /* =========================================================
     1. DataPipe / Google Drive
     ========================================================= */
  function dataPipeConfigured(){
    return DATAPIPE_EXPERIMENT_ID && !DATAPIPE_EXPERIMENT_ID.startsWith('REPLACE_');
  }

  async function getDataPipeCondition(){
    if(!dataPipeConfigured()) throw new Error('DataPipe experiment ID 尚未配置。');

    const storageKey = `Exp2a_DP_Condition_${currentSubjectId}`;
    const cached = sessionStorage.getItem(storageKey);
    if(cached === '0' || cached === '1') return Number(cached);

    const response = await fetch(`${DATAPIPE_BASE}/condition/`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({experimentID:DATAPIPE_EXPERIMENT_ID})
    });
    const result = await response.json().catch(()=>({}));
    if(!response.ok || typeof result.condition !== 'number'){
      throw new Error(result.message || `DataPipe 条件分配失败（HTTP ${response.status}）`);
    }
    if(![0,1].includes(result.condition)){
      throw new Error(`收到未预期的条件编号：${result.condition}。请确认 DataPipe 条件数设置为 2。`);
    }
    sessionStorage.setItem(storageKey, String(result.condition));
    return result.condition;
  }

  function pad2(n){ return String(n).padStart(2,'0'); }
  function pad3(n){ return String(n).padStart(3,'0'); }
  function formatLocalTimestamp(date=new Date()){
    return `${date.getFullYear()}${pad2(date.getMonth()+1)}${pad2(date.getDate())}_${pad2(date.getHours())}${pad2(date.getMinutes())}${pad2(date.getSeconds())}_${pad3(date.getMilliseconds())}`;
  }
  function buildUniqueDataFilename(){
    const safeSubject = String(currentSubjectId).replace(/[^a-zA-Z0-9_-]/g,'_');
    return `${formatLocalTimestamp(new Date())}_Exp2a_Adult_Subject${safeSubject}_Seq${sequenceName}.csv`;
  }

  const CLEAN_CSV_COLUMNS = [
    'Subject_ID','Study_ID','Study_Path','Session_UUID','Age_Group',
    'DataPipe_Condition','Version','Sequence',
    'Formal_Trial_Order','Block','Block_Position',
    'Image_Number','Image_ID','Image_File','Scene_ID','Scene_Name','Risk_Level',
    'Config_Code','Config_Name_CN','Perception_Level','Prediction_Level','Execution_Level','Manipulation_Text',
    'Safety_Score','Safety_RT_ms','Trust_Score','Trust_RT_ms','Cooperation_Score','Cooperation_RT_ms',
    'Back_Count','Total_Trial_Time_ms',
    'Experiment_Total_Time_ms','Formal_Total_Time_ms','Page_Hidden_Count','Page_Hidden_Total_ms',
    'Baseline_Ability_Points','Baseline_Emotion_Points','Concept_Quiz_Attempts','Energy_Quiz_Attempts',
    'Browser_Context','User_Agent','Image_Format'
  ];

  function csvEscape(value){
    if(value === null || value === undefined) return '';
    const s = String(value);
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }

  /* =========================================================
     本地进度自动保存与恢复
     ---------------------------------------------------------
     每完成1个正式trial即保存到 localStorage。
     若图片异常、页面刷新或重新载入，会沿用原Sequence，
     并从第一个未完成trial继续。
     ========================================================= */
  const CHECKPOINT_KEY_PREFIX = 'exp2a_formal_checkpoint_v1_';

  function checkpointKey(pid=currentSubjectId){
    return CHECKPOINT_KEY_PREFIX + String(pid||'');
  }

  function normalizeCheckpointRows(rows){
    const byOrder=new Map();
    (Array.isArray(rows)?rows:[]).forEach(row=>{
      const order=Number(row?.Formal_Trial_Order);
      if(Number.isInteger(order) && order>=1 && order<=TOTAL_FORMAL_TRIALS){
        byOrder.set(order,row);
      }
    });

    const contiguous=[];
    for(let expected=1;expected<=TOTAL_FORMAL_TRIALS;expected++){
      const row=byOrder.get(expected);
      if(!row) break;
      contiguous.push(row);
    }
    return contiguous;
  }

  function loadExperimentCheckpoint(pid=currentSubjectId){
    try{
      const raw=localStorage.getItem(checkpointKey(pid));
      if(!raw) return null;
      const cp=JSON.parse(raw);
      if(!cp || cp.subjectID!==pid || cp.studyID!==STUDY_ID) return null;
      cp.rows=normalizeCheckpointRows(cp.rows);
      return cp;
    }catch(error){
      console.warn('读取实验进度失败：',error);
      return null;
    }
  }

  function saveExperimentCheckpointRow(row){
    try{
      const existing=loadExperimentCheckpoint(currentSubjectId);
      const rows=normalizeCheckpointRows([
        ...((existing&&existing.rows)||[]),
        row
      ]);

      localStorage.setItem(
        checkpointKey(currentSubjectId),
        JSON.stringify({
          subjectID:currentSubjectId,
          studyID:STUDY_ID,
          studyPath,
          condition:dataPipeCondition,
          sequence:sequenceName,
          sessionUUID,
          baselineAbility,
          baselineEmotion,
          rows,
          completedCount:rows.length,
          updatedAt:Date.now()
        })
      );
    }catch(error){
      console.error('保存实验进度失败：',error);
    }
  }

  function clearExperimentCheckpoint(){
    try{
      localStorage.removeItem(checkpointKey(currentSubjectId));
    }catch(error){
      console.warn('清理实验进度失败：',error);
    }
  }

  function getPersistedFormalRows(){
    const cp=loadExperimentCheckpoint(currentSubjectId);
    return cp ? cp.rows : [];
  }

  function getMergedFormalRows(){
    const merged=new Map();

    getPersistedFormalRows().forEach(row=>{
      merged.set(Number(row.Formal_Trial_Order),row);
    });

    jsPsych.data.get().filter({Event_Type:'Formal_Trial'}).values().forEach(row=>{
      merged.set(Number(row.Formal_Trial_Order),row);
    });

    return [...merged.values()]
      .filter(row=>Number.isInteger(Number(row.Formal_Trial_Order)))
      .sort((a,b)=>Number(a.Formal_Trial_Order)-Number(b.Formal_Trial_Order));
  }

  window.downloadCurrentProgressCSV=function(){
    const rows=getMergedFormalRows();
    if(rows.length===0){
      alert('当前还没有已完成的正式trial可保存。');
      return;
    }

    const csv='\uFEFF'+buildCleanFormalCSV();
    const safeSubject=String(currentSubjectId).replace(/[^a-zA-Z0-9_-]/g,'_');
    const filename=`PARTIAL_${formatLocalTimestamp(new Date())}_${STUDY_ID}_Subject${safeSubject}_${rows.length}of${TOTAL_FORMAL_TRIALS}.csv`;

    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');

    link.href=url;
    link.download=filename;
    link.style.display='none';

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };

  function buildCleanFormalCSV(){
    const rows = getMergedFormalRows();
    const sessionMetrics = {
      Experiment_Total_Time_ms: experimentTotalTimeMs(),
      Formal_Total_Time_ms: formalTotalTimeMs(),
      Page_Hidden_Count: pageHiddenCount,
      Page_Hidden_Total_ms: pageHiddenTotalMs,
      Concept_Quiz_Attempts: conceptQuizAttempts,
      Energy_Quiz_Attempts: energyQuizAttempts
    };
    const lines = [CLEAN_CSV_COLUMNS.join(',')];
    rows.forEach(row=>{
      const exportRow = {...row, ...sessionMetrics};
      lines.push(CLEAN_CSV_COLUMNS.map(col=>csvEscape(exportRow[col])).join(','));
    });
    return lines.join('\r\n');
  }

  const UPLOAD_MAX_ATTEMPTS = 3;
  const UPLOAD_TIMEOUT_MS = 30000;
  let lastFinalCsvString = '';
  let lastFinalUploadFilename = '';

  function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
  }

  async function fetchWithTimeout(url,options,timeoutMs){
    if(typeof AbortController === 'undefined'){
      return fetch(url,options);
    }
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),timeoutMs);
    try{
      return await fetch(url,{...options,signal:controller.signal});
    }finally{
      clearTimeout(timer);
    }
  }

  function pendingUploadStorageKey(){
    return `Exp2a_PendingUpload_${currentSubjectId}`;
  }

  function savePendingUpload(csvString,filename){
    try{
      localStorage.setItem(
        pendingUploadStorageKey(),
        JSON.stringify({
          experimentID:DATAPIPE_EXPERIMENT_ID,
          subjectID:currentSubjectId,
          sessionUUID,
          sequence:sequenceName,
          filename,
          csv:csvString,
          savedAt:Date.now()
        })
      );
    }catch(error){
      console.warn('无法写入本地待上传备份：',error);
    }
  }

  function clearPendingUpload(){
    try{
      localStorage.removeItem(pendingUploadStorageKey());
    }catch(error){
      console.warn('无法清理本地待上传备份：',error);
    }
  }

  async function uploadFinalDataToDataPipe(csvString,fixedFilename,onAttempt){
    if(!dataPipeConfigured()) throw new Error('DataPipe experiment ID 尚未配置。');

    const filename=fixedFilename || buildUniqueDataFilename();
    const requestBody=JSON.stringify({
      experimentID:DATAPIPE_EXPERIMENT_ID,
      filename,
      data:csvString
    });
    const bodyBytes=new Blob([requestBody]).size;
    let lastError=null;

    for(let attempt=1;attempt<=UPLOAD_MAX_ATTEMPTS;attempt++){
      if(typeof onAttempt==='function'){
        try{ onAttempt(attempt,UPLOAD_MAX_ATTEMPTS); }catch(_e){}
      }

      try{
        const fetchOptions={
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:requestBody,
          cache:'no-store'
        };

        // 小体积请求允许在移动端页面状态变化时继续发送；
        // 体积较大时不启用 keepalive，避免部分浏览器限制。
        if(bodyBytes<60000) fetchOptions.keepalive=true;

        const response=await fetchWithTimeout(
          `${DATAPIPE_BASE}/data/`,
          fetchOptions,
          UPLOAD_TIMEOUT_MS
        );

        const result=await response.json().catch(()=>({}));

        if(response.status===201 || response.status===202){
          return {
            filename,
            result,
            httpStatus:response.status,
            queued:response.status===202,
            attempts:attempt
          };
        }

        const code=result.error ? ` [${result.error}]` : '';
        throw new Error(
          `${result.message || `DataPipe 数据上传失败（HTTP ${response.status}）`}${code}`
        );
      }catch(error){
        lastError=error;
        console.warn(`[DataPipe upload] attempt ${attempt}/${UPLOAD_MAX_ATTEMPTS} failed`,error);
        if(attempt<UPLOAD_MAX_ATTEMPTS){
          await sleep(1500*attempt);
        }
      }
    }

    throw new Error(
      `连续 ${UPLOAD_MAX_ATTEMPTS} 次上传均未成功：${String(lastError?.message || lastError || '未知错误')}`
    );
  }

  function prepareLocalBackup(csvString){
    window.downloadCSV = function(){
      const safeSubject = String(currentSubjectId).replace(/[^a-zA-Z0-9_-]/g,'_');
      const fileName = `BACKUP_${formatLocalTimestamp(new Date())}_Exp2a_Subject${safeSubject}_Seq${sequenceName}.csv`;
      const blob = new Blob([csvString.startsWith('\uFEFF') ? csvString : '\uFEFF'+csvString], {type:'text/csv;charset=utf-8;'});
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.href=url;
      link.download=fileName;
      link.style.visibility='hidden';
      document.body.appendChild(link);
      link.click();

      }

  function imageMeta(file){
    const m=String(file).match(/^(high|low)([1-6])\.webp$/i);
    if(!m) throw new Error(`无法解析风险图片：${file}`);
    const risk=m[1].toLowerCase()==='high'?'High':'Low';
    const sceneId=Number(m[2]);
    return {risk,sceneId};
  }

  function validateSequenceTemplates(){
    const errors=[];
    const codes=Object.keys(CONFIGS);
    const images=[];
    ['high','low'].forEach(r=>{ for(let i=1;i<=6;i++) images.push(`${r}${i}.webp`); });
    const expectedPairs=new Set();
    images.forEach(img=>codes.forEach(cfg=>expectedPairs.add(`${img}|${cfg}`)));

    function checkMinGap(rows, selector, minGap, label, seq){
      const last=new Map();
      rows.forEach((row,i)=>{
        const value=selector(row);
        if(last.has(value)){
          const gap=(i+1)-last.get(value);
          if(gap<minGap) errors.push(`${seq} ${label} ${value} 间隔=${gap}，小于${minGap}`);
        }
        last.set(value,i+1);
      });
    }

    ['A','B'].forEach(seq=>{
      const rows=SEQUENCE_TEMPLATES[seq];
      if(rows.length!==72) errors.push(`Sequence ${seq} trial数=${rows.length}，应为72`);

      const pairSet=new Set();
      const cfgCount=Object.fromEntries(codes.map(c=>[c,0]));
      const cfgRisk=Object.fromEntries(codes.map(c=>[c,{High:0,Low:0}]));
      const imgCount=Object.fromEntries(images.map(x=>[x,0]));

      rows.forEach(([img,cfg],i)=>{
        if(!CONFIGS[cfg]) errors.push(`${seq} Trial${i+1} 未知配置 ${cfg}`);
        if(!(img in imgCount)) errors.push(`${seq} Trial${i+1} 未知图片 ${img}`);

        const meta=imageMeta(img);
        if(CONFIGS[cfg]){
          cfgCount[cfg]++;
          cfgRisk[cfg][meta.risk]++;
        }
        if(img in imgCount) imgCount[img]++;

        const pair=`${img}|${cfg}`;
        if(pairSet.has(pair)) errors.push(`${seq} 重复配对 ${pair}`);
        pairSet.add(pair);

        if(i>0){
          const [prevImg,prevCfg]=rows[i-1];
          const prevMeta=imageMeta(prevImg);
          if(prevCfg===cfg) errors.push(`${seq} Trial${i}/${i+1} 配置连续`);
          if(prevMeta.sceneId===meta.sceneId) errors.push(`${seq} Trial${i}/${i+1} 场景连续`);
          if(prevMeta.risk===meta.risk) errors.push(`${seq} Trial${i}/${i+1} 风险水平连续`);
        }
      });

      codes.forEach(c=>{
        if(cfgCount[c]!==12) errors.push(`${seq} ${c} 总次数=${cfgCount[c]}，应为12`);
        if(cfgRisk[c].High!==6 || cfgRisk[c].Low!==6){
          errors.push(`${seq} ${c} 风险次数 H${cfgRisk[c].High}/L${cfgRisk[c].Low}，应为H6/L6`);
        }
      });
      images.forEach(img=>{
        if(imgCount[img]!==6) errors.push(`${seq} ${img} 次数=${imgCount[img]}，应为6`);
      });

      if(pairSet.size!==72) errors.push(`${seq} Image×Config 唯一配对数=${pairSet.size}，应为72`);
      expectedPairs.forEach(pair=>{
        if(!pairSet.has(pair)) errors.push(`${seq} 缺少配对 ${pair}`);
      });

      for(let b=0;b<3;b++){
        const blockRows=rows.slice(b*24,(b+1)*24);
        const blockCfg=Object.fromEntries(codes.map(c=>[c,0]));
        const blockImg=Object.fromEntries(images.map(x=>[x,0]));
        const blockRisk={High:0,Low:0};
        blockRows.forEach(([img,cfg])=>{
          blockCfg[cfg]++;
          blockImg[img]++;
          blockRisk[imageMeta(img).risk]++;
        });
        codes.forEach(c=>{
          if(blockCfg[c]!==4) errors.push(`${seq} Block${b+1} ${c} 次数=${blockCfg[c]}，应为4`);
        });
        images.forEach(img=>{
          if(blockImg[img]!==2) errors.push(`${seq} Block${b+1} ${img} 次数=${blockImg[img]}，应为2`);
        });
        if(blockRisk.High!==12 || blockRisk.Low!==12){
          errors.push(`${seq} Block${b+1} 风险次数 H${blockRisk.High}/L${blockRisk.Low}，应为H12/L12`);
        }
      }

      checkMinGap(rows,row=>row[1],3,'配置',seq);
      checkMinGap(rows,row=>imageMeta(row[0]).sceneId,5,'场景',seq);
      checkMinGap(rows,row=>row[0],8,'图片',seq);
    });

    if(errors.length) throw new Error('Sequence校验失败：'+errors.join('；'));
  }

  /* =========================================================
     5. 图片后台预热 + 正式资源门控
     ========================================================= */
  const SCENE_PRELOAD_CONCURRENCY=3;
  const scenePreloader=(()=>{
    let queue=[];
    let active=0;
    let running=false;
    const loaded=new Set();
    const loading=new Set();
    const queued=new Set();
    const failed=new Map();
    const waiters=new Map();

    function norm(file){
      const clean=String(file||'').replace(/^\.\.\/risk_img\//,'').replace(/^risk_img\//,'').replace(/[^A-Za-z0-9_.-]/g,'');
      return `${ASSET_BASE}${clean}`;
    }
    function loadedCount(){ return loaded.size; }
    function isLoaded(file){ return loaded.has(norm(file)); }
    function notifySuccess(file){
      const list=waiters.get(file)||[]; waiters.delete(file);
      list.forEach(w=>{try{w.ok();}catch(e){console.error(e);}});
    }
    function notifyFailure(file,error){
      const list=waiters.get(file)||[]; waiters.delete(file);
      list.forEach(w=>{try{if(w.fail)w.fail(error);}catch(e){console.error(e);}});
    }
    function enqueue(files,front=false){
      const fresh=[];
      files.forEach(raw=>{
        const file=norm(raw);
        if(loaded.has(file)||loading.has(file)||queued.has(file)) return;
        queued.add(file); fresh.push(file);
      });
      queue=front?fresh.concat(queue):queue.concat(fresh);
      if(running) pump();
    }
    function prioritize(file){
      file=norm(file);
      if(loaded.has(file)||loading.has(file)) return;
      queue=queue.filter(x=>x!==file);
      queued.delete(file); queued.add(file); queue.unshift(file);
      if(running) pump();
    }
    function whenLoaded(file,ok,fail){
      file=norm(file);
      if(loaded.has(file)){ setTimeout(ok,0); return; }
      if(!waiters.has(file)) waiters.set(file,[]);
      waiters.get(file).push({ok,fail}); prioritize(file);
    }
    function markLoaded(file){
      file=norm(file);
      if(loaded.has(file)) return;
      loaded.add(file); loading.delete(file); queued.delete(file); failed.delete(file); notifySuccess(file);
    }
    function launch(file){
      active++; loading.add(file); queued.delete(file);
      jsPsych.pluginAPI.preloadImages(
        [file],
        function(){ active--; loading.delete(file); loaded.add(file); failed.delete(file); notifySuccess(file); pump(); },
        function(){},
        function(errorInfo){
          active--; loading.delete(file);
          const tries=(failed.get(file)||0)+1; failed.set(file,tries);
          console.warn('[scene preload] error',file,errorInfo,'try',tries);
          if(tries<=2){
            setTimeout(()=>{ if(!loaded.has(file)&&!loading.has(file)){ queued.add(file); queue.push(file); pump(); } },1500);
          }else{ notifyFailure(file,errorInfo); pump(); }
        }
      );
    }
    function pump(){
      if(!running) return;
      while(active<SCENE_PRELOAD_CONCURRENCY && queue.length>0){
        const file=queue.shift();
        if(loaded.has(file)||loading.has(file)){ queued.delete(file); continue; }
        launch(file);
      }
    }
    function start(files){ running=true; enqueue(files,false); pump(); }
    return {start,enqueue,prioritize,whenLoaded,markLoaded,isLoaded,loadedCount,normalize:norm};
  })();

  /* 页面打开后立即预热机器人、练习图及12张正式风险图。 */

     - 全部资源准备完成后才继续，避免平板/手机在trial中出现“图片加载中”。
  */
  const RESOURCE_GATE_FILES=['robot.webp','test.webp',...ALL_FORMAL_IMAGES];
  const RESOURCE_GATE_CONCURRENCY=4;
  const PERSISTENT_ASSET_CACHE='study2-risk-assets-v2';

  function canonicalAssetURL(rawFile){
    return new URL(scenePreloader.normalize(rawFile),window.location.href).href;
  }

  async function getPersistentAssetResponse(rawFile){
    if(!('caches' in window)) return null;
    try{
      const cache=await caches.open(PERSISTENT_ASSET_CACHE);
      return await cache.match(canonicalAssetURL(rawFile));
    }catch(error){
      console.warn('读取持久化图片缓存失败：',rawFile,error);
      return null;
    }
  }

  async function fetchAndPersistAsset(rawFile){
    const url=canonicalAssetURL(rawFile);

    if(!('caches' in window)){
      const response=await fetch(url,{cache:'force-cache'});
      if(!response.ok) throw new Error(`资源请求失败 HTTP ${response.status}: ${rawFile}`);
      return response;
    }

    const cache=await caches.open(PERSISTENT_ASSET_CACHE);
    const cached=await cache.match(url);

    if(cached){
      return cached;
    }

    const response=await fetch(url,{cache:'reload'});
    if(!response.ok){
      throw new Error(`资源请求失败 HTTP ${response.status}: ${rawFile}`);
    }

    await cache.put(url,response.clone());
    return response;
  }


  function waitMs(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
  }

  async function loadAndDecodeResource(rawFile,maxAttempts=3){
    let lastError=null;

    for(let attempt=1;attempt<=maxAttempts;attempt++){
      let objectURL=null;

      try{
        const response=await fetchAndPersistAsset(rawFile);
        const blob=await response.clone().blob();
        objectURL=URL.createObjectURL(blob);

        const img=new Image();
        img.loading='eager';
        img.decoding='sync';

        await new Promise((resolve,reject)=>{
          let settled=false;
          const timer=setTimeout(()=>{
            if(settled) return;
            settled=true;
            reject(new Error(`资源解码超时：${rawFile}`));
          },30000);

          img.onload=()=>{
            if(settled) return;
            settled=true;
            clearTimeout(timer);
            resolve();
          };

          img.onerror=()=>{
            if(settled) return;
            settled=true;
            clearTimeout(timer);
            reject(new Error(`资源解码失败：${rawFile}`));
          };

          img.src=objectURL;

          if(img.complete && img.naturalWidth>0){
            settled=true;
            clearTimeout(timer);
            resolve();
          }
        });

        if(typeof img.decode==='function'){
          try{
            await img.decode();
          }catch(error){
            if(!(img.complete && img.naturalWidth>0)) throw error;
          }
        }

        if(!(img.complete && img.naturalWidth>0)){
          throw new Error(`资源未能完成解码：${rawFile}`);
        }

        scenePreloader.markLoaded(rawFile);
        return canonicalAssetURL(rawFile);
      }catch(error){
        lastError=error;
        console.warn(`[resource gate] ${rawFile} attempt ${attempt}/${maxAttempts} failed`,error);

        if('caches' in window){
          try{
            const cache=await caches.open(PERSISTENT_ASSET_CACHE);
            await cache.delete(canonicalAssetURL(rawFile));
          }catch(_e){}
        }

        if(attempt<maxAttempts) await waitMs(1000*attempt);
      }finally{
        if(objectURL) URL.revokeObjectURL(objectURL);
      }
    }

    throw lastError || new Error(`资源准备失败：${rawFile}`);
  }

  async function preloadAllExperimentResources(onProgress){
    const files=[...new Set(RESOURCE_GATE_FILES)];
    let completed=0;
    let nextIndex=0;

    async function worker(){
      while(true){
        const index=nextIndex++;
        if(index>=files.length) return;
        const file=files[index];
        await loadAndDecodeResource(file,3);
        completed++;
        if(typeof onProgress==='function'){
          onProgress(completed,files.length,file);
        }
      }
    }

    const workerCount=Math.min(RESOURCE_GATE_CONCURRENCY,files.length);
    await Promise.all(
      Array.from({length:workerCount},()=>worker())
    );

    return {completed,total:files.length};
  }

            detail.innerText=`${result.completed} / ${result.total}`;
            status.style.color='var(--green)';
            status.innerText='✓ 所有实验图片已准备完成，即将进入练习。';

              jsPsych.finishTrial({

            console.error('资源门控失败：',error);

            status.innerText='部分实验图片暂未加载成功，请检查网络后重新尝试。';

            retry.style.display='inline-block';
            running=false;
          }

      }
    };

          <p style="line-height:1.8;color:#ffcf8a;font-weight:800;">后续体验的操作方式保持不变。请继续将每个道路场景视为一次独立的乘车体验，并根据当前页面的信息重新判断。</p>
          <button id="rest-continue" class="continue-btn">继续正式体验</button>
        </div>
      </div>`,
      data:{Event_Type:'Rest_Break',Completed_Block:completedBlock},
      on_load:()=>document.getElementById('rest-continue').addEventListener('click',()=>jsPsych.finishTrial())
    };
  }

  function createRatingTrialNode(trialData,isFormal=true){
    const questions=[
      '与普通汽车相比，我认为乘坐配备这款智驾助手的汽车会更安全。',
      '我完全信任这款智驾助手。',
      '在当前路况下，我愿意选择这款智驾助手完成这段行程。'
    ];
    const buttons=[1,2,3,4,5].map(n=>`<button class="rating-option" data-score="${n}" disabled>${n}</button>`).join('');

    return {
      type:jsPsychHtmlKeyboardResponse,
      choices:'NO_KEYS',
      stimulus:`<div class="trial-shell">
        <div class="trial-header">
          <span>${isFormal?`正式体验 ${trialData.formalOrder} / ${TOTAL_FORMAL_TRIALS}`:'练习体验'}</span>
          <span>${isFormal?'请根据当前信息独立判断':'练习不计入正式结果'}</span>
        </div>
        <div class="scene-zone">${renderSceneImage(trialData.image)}</div>
        <div class="assistant-zone">${renderAssistantInfo(trialData,isFormal)}</div>
        <div class="rating-zone">
          <div class="rating-topline">
            <div id="rating-progress" class="rating-progress">第 1 题 / 共 3 题</div>
            <button id="rating-back" class="rating-back hidden-visibility" type="button">返回上一题</button>
          </div>
          <div id="rating-question" class="rating-question">${questions[0]}</div>
          <div class="rating-options">${buttons}</div>
          <div class="rating-anchors"><span>1 非常不赞同</span><span>3 一般</span><span>5 非常赞同</span></div>
          <button id="rating-confirm" class="rating-confirm" disabled>确认并继续</button>
        </div>
      </div>`,
      data:{Event_Type:isFormal?'Formal_Trial':'Practice_Trial'},
      on_load:function(){
        let phase=0;
        const drafts=[null,null,null];
        const scores=[null,null,null];
        const rts=[null,null,null];
        let backCount=0;
        let totalStart=null;
        let phaseStart=null;

        const shell=document.querySelector('.trial-shell');
        const q=document.getElementById('rating-question');
        const progress=document.getElementById('rating-progress');
        const back=document.getElementById('rating-back');
        const confirm=document.getElementById('rating-confirm');
        const options=Array.from(document.querySelectorAll('.rating-option'));
        const sceneImg=document.getElementById('scene-image');
        const sceneHint=document.getElementById('scene-load-hint');
        const imagePath=sceneImg?sceneImg.dataset.src:`${ASSET_BASE}${trialData.image}`;
        let sceneReady=false;
        let resizeObserver=null;

        function elementIsClipped(el){
          if(!el) return false;
          return (el.scrollHeight-el.clientHeight>2)||(el.scrollWidth-el.clientWidth>2);
        }
        function enableAdaptiveLayoutIfNeeded(){
          if(!shell || shell.classList.contains('adaptive-scroll')) return;
          const viewportH=window.visualViewport?window.visualViewport.height:window.innerHeight;
          const clipped=Array.from(shell.children).some(elementIsClipped) || elementIsClipped(q);
          if(clipped || shell.scrollHeight>viewportH+3) shell.classList.add('adaptive-scroll');
        }
        requestAnimationFrame(()=>requestAnimationFrame(enableAdaptiveLayoutIfNeeded));
        if('ResizeObserver' in window && shell){
          resizeObserver=new ResizeObserver(enableAdaptiveLayoutIfNeeded);
          resizeObserver.observe(shell);
          Array.from(shell.children).forEach(x=>resizeObserver.observe(x));
        }

        let imageRetryCount=0;
        const MAX_TRIAL_IMAGE_RETRIES=3;

        function setImageHintHTML(html,color='var(--muted)'){
          if(!sceneHint) return;
          sceneHint.style.display='flex';
          sceneHint.style.color=color;
          sceneHint.innerHTML=html;
        }

        function enableRatingsAfterImage(){
          if(sceneReady) return;
          sceneReady=true;
          totalStart=Date.now();
          phaseStart=totalStart;
          scenePreloader.markLoaded(imagePath);
          if(sceneHint) sceneHint.style.display='none';
          options.forEach(btn=>btn.disabled=false);
          requestAnimationFrame(enableAdaptiveLayoutIfNeeded);
        }

        let currentObjectURL=null;

        async function attachActualImage(forceReload=false){
          if(!sceneImg || sceneReady) return;

          sceneImg.onload=null;
          sceneImg.onerror=null;

          if(currentObjectURL){
            URL.revokeObjectURL(currentObjectURL);
            currentObjectURL=null;
          }

          sceneImg.onload=()=>{
            if(currentObjectURL){
              setTimeout(()=>{
                try{ URL.revokeObjectURL(currentObjectURL); }catch(_e){}
                currentObjectURL=null;
              },500);
            }
            enableRatingsAfterImage();
          };

          sceneImg.onerror=(error)=>handleImageError(error);

          try{
            if(!forceReload){
              const cached=await getPersistentAssetResponse(imagePath);

              if(cached){
                const blob=await cached.blob();
                currentObjectURL=URL.createObjectURL(blob);
                sceneImg.src=currentObjectURL;

                if(sceneImg.complete && sceneImg.naturalWidth>0){
                  enableRatingsAfterImage();
                }
                return;
              }
            }

            const response=await fetch(
              forceReload
                ? `${canonicalAssetURL(imagePath)}?retry=${Date.now()}`
                : canonicalAssetURL(imagePath),
              {cache:forceReload?'reload':'force-cache'}
            );

            if(!response.ok){
              throw new Error(`HTTP ${response.status}`);
            }

            if('caches' in window){
              try{
                const cache=await caches.open(PERSISTENT_ASSET_CACHE);
                await cache.put(canonicalAssetURL(imagePath),response.clone());
              }catch(error){
                console.warn('当前场景写入持久缓存失败：',error);
              }
            }

            const blob=await response.blob();
            currentObjectURL=URL.createObjectURL(blob);
            sceneImg.src=currentObjectURL;

            if(sceneImg.complete && sceneImg.naturalWidth>0){
              enableRatingsAfterImage();
            }
          }catch(error){
            handleImageError(error);
          }
        }

        function handleImageError(error){
          sceneReady=false;
          options.forEach(btn=>btn.disabled=true);
          confirm.disabled=true;
          imageRetryCount++;

          console.error('trial image load error',imagePath,'retry',imageRetryCount,error);

          if(imageRetryCount<=MAX_TRIAL_IMAGE_RETRIES){
            setImageHintHTML(
              `当前驾驶场景暂未加载成功，正在重新加载（${imageRetryCount}/${MAX_TRIAL_IMAGE_RETRIES}）……`,
              'var(--warning)'
            );
            setTimeout(()=>attachActualImage(true),1200);
            return;
          }

          setImageHintHTML(
            `<div style="max-width:560px;line-height:1.7;">
              <div style="font-weight:800;margin-bottom:10px;">当前驾驶场景暂未加载成功。</div>
              <div style="font-size:13px;color:#bbb;margin-bottom:12px;">
                已完成的正式trial已自动保存在本机浏览器中，不会因为重新加载页面而丢失。
              </div>
              <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                <button id="scene-retry-current" class="continue-btn" style="min-width:150px;min-height:42px;font-size:15px;">
                  重试当前场景
                </button>
                <button id="scene-reload-page" class="continue-btn" style="min-width:190px;min-height:42px;font-size:15px;background:var(--blue);color:#111;">
                  保存进度并重新载入
                </button>
                <button id="scene-download-progress" class="continue-btn" style="min-width:190px;min-height:42px;font-size:15px;background:#ffb74d;color:#111;">
                  下载当前进度CSV
                </button>
              </div>
            </div>`,
            'var(--warning)'
          );

          const retryBtn=document.getElementById('scene-retry-current');
          const reloadBtn=document.getElementById('scene-reload-page');
          const downloadBtn=document.getElementById('scene-download-progress');

          if(retryBtn){
            retryBtn.addEventListener('click',()=>{
              imageRetryCount=0;
              setImageHintHTML('正在重新加载当前驾驶场景，请稍候……');
              attachActualImage(true);
            },{once:true});
          }

          if(reloadBtn){
            reloadBtn.addEventListener('click',()=>location.reload(),{once:true});
          }

          if(downloadBtn){
            downloadBtn.addEventListener('click',()=>window.downloadCurrentProgressCSV());
          }
        }

        /*
          iPad长实验中可能回收图片内存，因此每个trial都直接让<img>读取原始URL；
          正常时命中浏览器缓存，失败时使用cache-busting参数强制重新请求。
        */
        setImageHintHTML('正在准备当前驾驶场景，请稍候…');
        attachActualImage(false);

        function setSelected(score){
          options.forEach(btn=>btn.classList.toggle('selected',Number(btn.dataset.score)===score));
          confirm.disabled=score===null;
        }
        function renderPhase(){
          q.innerText=questions[phase];
          progress.innerText=`第 ${phase+1} 题 / 共 3 题`;
          back.classList.toggle('hidden-visibility',phase===0);
          phaseStart=Date.now();
          setSelected(drafts[phase]);
          requestAnimationFrame(enableAdaptiveLayoutIfNeeded);
        }

        options.forEach(btn=>btn.addEventListener('click',()=>{
          drafts[phase]=Number(btn.dataset.score);
          setSelected(drafts[phase]);
        }));

        back.addEventListener('click',()=>{
          if(phase===0) return;
          const newPhase=phase-1;
          for(let i=newPhase+1;i<3;i++){
            drafts[i]=null; scores[i]=null; rts[i]=null;
          }
          phase=newPhase;
          backCount++;
          renderPhase();
        });

        confirm.addEventListener('click',()=>{
          if(drafts[phase]===null) return;
          scores[phase]=drafts[phase];
          rts[phase]=Date.now()-phaseStart;
          if(phase<2){
            phase++;
            renderPhase();
            return;
          }

          if(resizeObserver) resizeObserver.disconnect();
          const imageBase=String(trialData.image||'').replace(/\.[^.]+$/,'');
          const imageNumber=(String(trialData.image||'').match(/(\d+)/)||[])[1]||'';

          const completedTrialData={
            Event_Type:isFormal?'Formal_Trial':'Practice_Trial',
            Subject_ID:currentSubjectId,
            Study_ID:STUDY_ID,
            Study_Path:studyPath,
            Session_UUID:sessionUUID,
            Age_Group:AGE_GROUP,
            DataPipe_Condition:dataPipeCondition,
            Version:currentVersion,
            Sequence:sequenceName,
            Formal_Trial_Order:isFormal?trialData.formalOrder:0,
            Block:isFormal?trialData.block:0,
            Block_Position:isFormal?trialData.blockPosition:0,
            Image_Number:imageNumber,
            Image_ID:imageBase,
            Image_File:trialData.image,
            Scene_ID:trialData.sceneId,
            Scene_Name:trialData.sceneName,
            Risk_Level:isFormal?trialData.risk:'Practice',
            Config_Code:trialData.config.code,
            Config_Name_CN:trialData.config.name,
            Perception_Level:trialData.config.perception===2?'High':'Low',
            Prediction_Level:trialData.config.prediction===2?'High':'Low',
            Execution_Level:trialData.config.execution===2?'High':'Low',
            Manipulation_Text:trialData.manipulationText,
            Safety_Score:scores[0],
            Safety_RT_ms:rts[0],
            Trust_Score:scores[1],
            Trust_RT_ms:rts[1],
            Cooperation_Score:scores[2],
            Cooperation_RT_ms:rts[2],
            Back_Count:backCount,
            Total_Trial_Time_ms:totalStart===null?null:Date.now()-totalStart,
            Baseline_Ability_Points:baselineAbility,
            Baseline_Emotion_Points:baselineEmotion,
            Concept_Quiz_Attempts:conceptQuizAttempts,
            Energy_Quiz_Attempts:energyQuizAttempts,
            Browser_Context:getBrowserContext(),
            User_Agent:navigator.userAgent||'',
            Image_Format:IMAGE_FORMAT
          };
          if(isFormal){ saveExperimentCheckpointRow(completedTrialData); }
          jsPsych.finishTrial(completedTrialData);
        });
      }
    };
  }

  /* =========================================================
     8. 主编号 / Study Path / 启动
     ========================================================= */
  function safeTextParam(value,maxLen=50){
    const v=String(value||'').trim();
    return /^[A-Za-z0-9_-]+$/.test(v) && v.length<=maxLen ? v : '';
  }

  function parseBaselinePoint(value){
    const n=Number(value);
    return Number.isInteger(n) && n>=1 && n<=9 ? n : null;
  }

  function loadInheritedBaseline(pid){
    const params=new URLSearchParams(window.location.search);

    const urlAbility=parseBaselinePoint(params.get('ba'));
    const urlEmotion=parseBaselinePoint(params.get('be'));

    // 第一优先级：1A 跳转 URL 直接传入。
    if(urlAbility!==null && urlEmotion!==null && urlAbility+urlEmotion===10){
      localStorage.setItem(BASELINE_ABILITY_KEY_PREFIX + pid, String(urlAbility));
      localStorage.setItem(BASELINE_EMOTION_KEY_PREFIX + pid, String(urlEmotion));
      return {ability:urlAbility, emotion:urlEmotion, source:'URL'};
    }

    // 第二优先级：以当前 Master PID 为键读取 1A 保存的本地备份。
    const storedAbility=parseBaselinePoint(
      localStorage.getItem(BASELINE_ABILITY_KEY_PREFIX + pid)
    );
    const storedEmotion=parseBaselinePoint(
      localStorage.getItem(BASELINE_EMOTION_KEY_PREFIX + pid)
    );

    if(storedAbility!==null && storedEmotion!==null && storedAbility+storedEmotion===10){
      return {ability:storedAbility, emotion:storedEmotion, source:'localStorage'};
    }

    return null;
  }
  function getContextFromURL(){
    const params=new URLSearchParams(window.location.search);
    return {
      pid:safeTextParam(params.get('pid'),30),
      path:safeTextParam(params.get('path'),30)
    };
  }
  function applyParticipantContext(){
    const fromURL=getContextFromURL();
    const storedPid=safeTextParam(localStorage.getItem(MASTER_PID_KEY),30);
    const pid=fromURL.pid || storedPid;

    // 第二部分的路径由当前页面自身决定；只有与本实验匹配的 URL path 才接受。
    studyPath=fromURL.path==='1A_2A'
      ? fromURL.path
      : DEFAULT_STUDY_PATH;

    if(pid){
      localStorage.setItem(MASTER_PID_KEY,pid);
      const input=document.getElementById('subject-id-input');
      if(input){ input.value=pid; input.readOnly=true; input.style.opacity='0.92'; }
      const info=document.getElementById('login-info');
      if(info) info.innerHTML=`已识别同一参与者的匿名实验编号：<b style="color:#fff;">${pid}</b><br><span style="font-size:13px;color:#8f9aa5;">请确认后点击“进入体验”。</span>`;
    }
    localStorage.setItem(STUDY_PATH_KEY,studyPath);
  }
  applyParticipantContext();

  document.getElementById('login-btn').addEventListener('click',startExperiment);

  async function startExperiment(){
    const inputVal=document.getElementById('subject-id-input').value.trim();
    if(!inputVal || !/^[A-Za-z0-9_-]{1,30}$/.test(inputVal)){
      alert('请输入有效的匿名实验编号（仅使用字母、数字、下划线或短横线）。');
      return;
    }
    currentSubjectId=inputVal;
    localStorage.setItem(MASTER_PID_KEY,currentSubjectId);
    localStorage.setItem(STUDY_PATH_KEY,studyPath);

    // 2A/2B 不再重复测量点数分配，直接继承同一参与者在 1A 中完成的基线分配。
    const inheritedBaseline=loadInheritedBaseline(currentSubjectId);
    if(!inheritedBaseline){
      alert(
        '未检测到第一部分的点数分配结果。\n\n'
        + '请从统一 start 页面完成前测和第一部分后，再进入当前页面。'
      );
      return;
    }

    baselineAbility=inheritedBaseline.ability;
    baselineEmotion=inheritedBaseline.emotion;

    const startButton=document.getElementById('login-btn');
    const originalButtonText=startButton.innerText;
    startButton.disabled=true;
    startButton.innerText='正在连接实验服务器…';

    const existingCheckpoint=loadExperimentCheckpoint(currentSubjectId);

    if(
      existingCheckpoint &&
      [0,1].includes(Number(existingCheckpoint.condition)) &&
      ['A','B'].includes(existingCheckpoint.sequence)
    ){
      dataPipeCondition=Number(existingCheckpoint.condition);
      sequenceName=existingCheckpoint.sequence;
      if(existingCheckpoint.sessionUUID){
        sessionUUID=String(existingCheckpoint.sessionUUID);
      }
    }else{
      try{
        dataPipeCondition=await getDataPipeCondition();
      }catch(error){
        console.error(error);
        startButton.disabled=false;
        startButton.innerText=originalButtonText;
        if(DATAPIPE_REQUIRED){
          alert('暂时无法连接实验服务器或获取实验条件，请检查网络后重试。\n\n'+(error.message||error));
          return;
        }
        dataPipeCondition=0;
      }

      sequenceName=['A','B'][dataPipeCondition];
    }

    currentVersion=`Exp2a_Adult_DP${dataPipeCondition}_Seq${sequenceName}`;

    jsPsych.data.addProperties({
      Subject_ID:currentSubjectId,
      Study_ID:STUDY_ID,
      Study_Path:studyPath,
      Baseline_Ability_Points:baselineAbility,
      Baseline_Emotion_Points:baselineEmotion,
      Session_UUID:sessionUUID,
      Age_Group:AGE_GROUP,
      DataPipe_Condition:dataPipeCondition,
      Version:currentVersion,
      Sequence:sequenceName,
      Browser_Context:getBrowserContext(),
      User_Agent:navigator.userAgent||'',
      Image_Format:IMAGE_FORMAT
    });

    experimentStartedAtMs=Date.now();
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('jspsych-target').innerHTML='';

    const formalTrials=buildFormalTrials();
    const practiceConfig=CONFIGS.HLH;
    const practiceTrial={
      image:'test.webp', sceneId:0, sceneName:'练习场景', risk:'Practice',
      config:practiceConfig,
      manipulationText:practiceConfig.text
    };

    const checkpoint=loadExperimentCheckpoint(currentSubjectId);
    const completedCount=checkpoint ? checkpoint.rows.length : 0;
    const resumeIndex=Math.min(completedCount,TOTAL_FORMAL_TRIALS);

    const timeline=[];

    if(resumeIndex>0 && resumeIndex<TOTAL_FORMAL_TRIALS){
      timeline.push(createResumeNode(resumeIndex));
      timeline.push(createResourceGateNode());
      if(formalStartedAtMs===null) formalStartedAtMs=Date.now();
    }else if(resumeIndex===0){
      timeline.push(createWelcomeNode());
      timeline.push(createConceptLearningNode());
      timeline.push(createEnergyLearningNode());
      timeline.push(createResourceGateNode());
      timeline.push(createPracticeInstructionNode());
      timeline.push(createRatingTrialNode(practiceTrial,false));
      timeline.push(createFormalInstructionNode());
    }

    for(let i=resumeIndex;i<formalTrials.length;i++){
      timeline.push(createRatingTrialNode(formalTrials[i],true));
      if(i===23) timeline.push(createRestNode(1));
      if(i===47) timeline.push(createRestNode(2));
    }

    jsPsych.run(timeline);
  }

</script>
